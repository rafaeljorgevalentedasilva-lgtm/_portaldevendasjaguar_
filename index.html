// Interpreta horários escritos em linguagem natural simples, sem chamadas externas.
// Formatos reconhecidos: "Segunda a sexta: 08:00 às 18:00", "Sábado: 08h às 12h",
// "Domingo fechado" e múltiplos intervalos separados por "e".
function normalizarHorarioTexto(texto){return String(texto||'').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—]/g,'-').replace(/\bsegunda-feira\b/g,'segunda').replace(/\bterca-feira\b/g,'terca').replace(/\bquarta-feira\b/g,'quarta').replace(/\bquinta-feira\b/g,'quinta').replace(/\bsexta-feira\b/g,'sexta');}
function diasDaLinha(linha){
 const dias=[['domingo',0],['dom',0],['segunda',1],['seg',1],['terca',2],['ter',2],['quarta',3],['qua',3],['quinta',4],['qui',4],['sexta',5],['sex',5],['sabado',6],['sab',6]];
 const encontrados=[];for(const [nome,num] of dias){const re=new RegExp('(^|[^a-z])'+nome+'([^a-z]|$)','g');let m;while((m=re.exec(linha))!==null)encontrados.push({num,index:m.index+ m[1].length,nome});}
 encontrados.sort((a,b)=>a.index-b.index);
 const unicos=[];for(const d of encontrados)if(!unicos.some(x=>x.num===d.num))unicos.push(d);
 if(/todos os dias|diariamente|dia todo/.test(linha))return [0,1,2,3,4,5,6];
 if(/fim de semana/.test(linha))return [0,6];
 if(unicos.length>=2){const entre=linha.slice(unicos[0].index,unicos[1].index);if(/\b(a|ate)\b/.test(entre)){const a=unicos[0].num,b=unicos[1].num,arr=[];let d=a;for(let i=0;i<7;i++){arr.push(d);if(d===b)break;d=(d+1)%7;}return arr;}}
 return unicos.map(x=>x.num);
}
function intervalosDaLinha(linha){
 const re=/(\d{1,2})(?:\s*[:h]\s*(\d{2})?)?\s*(?:as|a|ate|-)\s*(\d{1,2})(?:\s*[:h]\s*(\d{2})?)?/g;
 const saida=[];let m;while((m=re.exec(linha))!==null){const inicio=Number(m[1])*60+Number(m[2]||0),fim=Number(m[3])*60+Number(m[4]||0);if(inicio<1440&&fim<=1440&&inicio!==fim)saida.push([inicio,fim>inicio?fim:fim+1440]);}
 return saida;
}
function interpretarHorario(raw){
 const original=String(raw||'').trim();if(!original)return null;
 const texto=normalizarHorarioTexto(original);const linhas=texto.split(/[\n;|]+/).map(x=>x.trim()).filter(Boolean);const agenda=Array.from({length:7},()=>({definido:false,intervalos:[]}));let reconheceuDia=false,ultimosDias=[];
 for(const linha of linhas){let dias=diasDaLinha(linha);const intervalos=intervalosDaLinha(linha);if(!dias.length&&intervalos.length)dias=ultimosDias;if(!dias.length)continue;if(diasDaLinha(linha).length)ultimosDias=dias;reconheceuDia=true;const fechado=/fechado|nao abre|nao funciona|folga|descanso/.test(linha);for(const dia of dias){agenda[dia].definido=true;if(!fechado)agenda[dia].intervalos.push(...intervalos);}}
 if(!reconheceuDia)return null;
 return agenda;
}
function horarioAtualFortaleza(){const partes=new Intl.DateTimeFormat('en-US',{timeZone:'America/Fortaleza',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v={};partes.forEach(p=>v[p.type]=p.value);const mapa={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};return {dia:mapa[v.weekday],minuto:Number(v.hour)*60+Number(v.minute)};}
function calcularFuncionamento(raw){
 const agenda=interpretarHorario(raw);if(!agenda)return 'indisponivel';const agora=horarioAtualFortaleza(),hoje=agenda[agora.dia];
 if(hoje.definido){for(const [inicio,fim] of hoje.intervalos){if(agora.minuto>=inicio&&agora.minuto<Math.min(fim,1440))return 'aberto';}}
 // Também considera expediente que atravessa a meia-noite, iniciado no dia anterior.
 const ontem=agenda[(agora.dia+6)%7];if(ontem.definido){for(const [inicio,fim] of ontem.intervalos){if(fim>1440&&agora.minuto<fim-1440)return 'aberto';}}
 if(hoje.definido)return 'fechado';
 // Em uma agenda semanal reconhecida, dias não listados são considerados fechados.
 if(agenda.some(d=>d.definido))return 'fechado';
 return 'indisponivel';
}

function renderCatalog(){const q=(document.getElementById('q')?.value||'').toLowerCase(),c=document.getElementById('cat')?.value||'';let list=lojas.filter(x=>x.ativo!==false&&((x.nome+' '+x.cat).toLowerCase().includes(q))&&(!c||x.cat===c));list.sort((a,b)=>{const ra=ratingStats[a.id]||{media:0,total:0},rb=ratingStats[b.id]||{media:0,total:0};return rb.media-ra.media||rb.total-ra.total||a.nome.localeCompare(b.nome,'pt-BR')});const pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));catalogPage=Math.min(catalogPage,pages);const slice=list.slice((catalogPage-1)*PAGE_SIZE,catalogPage*PAGE_SIZE);const cards=document.getElementById('cards');if(cards)cards.innerHTML=slice.map(card).join('')||'<div class="msg">Nenhuma loja encontrada.</div>';const pg=document.getElementById('pagination');if(pg)pg.innerHTML=pages>1?`<button class="btn s" ${catalogPage===1?'disabled':''} onclick="changePage(${catalogPage-1})">Anterior</button><span>Página ${catalogPage} de ${pages}</span><button class="btn s" ${catalogPage===pages?'disabled':''} onclick="changePage(${catalogPage+1})">Próxima</button>`:'';}

async function visitanteHash(){let key='pvj_avaliador';let v=localStorage.getItem(key);if(!v){v=crypto.randomUUID();localStorage.setItem(key,v)}return crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}

async function avaliarLoja(id){const status=document.getElementById('rating-status');if(ratingDraft===null){if(status)status.textContent='Selecione uma nota antes de salvar.';return}const nota=ratingDraft;if(status)status.textContent='Enviando avaliação…';try{const hash=await visitanteHash();const {data,error}=await sb.rpc('avaliar_loja',{p_loja_id:Number(id),p_nota:Number(nota),p_visitante_hash:hash});if(error)throw error;if(data!==true){if(status)status.textContent='Este navegador já avaliou esta loja.';return}const {data:rows,error:statsError}=await sb.rpc('avaliacoes_publicas_lojas');if(statsError)throw statsError;ratingStats={};(rows||[]).forEach(x=>ratingStats[x.loja_id]={media:Number(x.media||0),total:Number(x.total||0)});detail(id);const msg=document.getElementById('rating-status');if(msg)msg.textContent='Obrigado! Sua avaliação foi registrada.';}catch(e){console.error(e);if(status)status.textContent='Falha ao registrar avaliação: '+(e.message||'verifique se o SQL atualizado foi executado no Supabase.');}}
function horarioMarkup(raw){const value=String(raw||'').trim();if(!value)return '';const texto=value.split(/\r?\n|\s*\|\s*|\s*;\s*/).map(x=>x.trim()).filter(Boolean).join(' · ');return `<section class="hours-panel" aria-label="Horário de funcionamento"><div class="hours-heading"><strong>Horário de funcionamento</strong></div><p class="hours-text">${esc(texto)}</p></section>`;}

let indiceFotoGaleria=0;
let fotosGaleriaAtuais=[];
function abrirFotoGaleria(indice){
 const viewer=document.getElementById('gallery-viewer');
 if(!viewer)return;
 fotosGaleriaAtuais=[...document.querySelectorAll('.gal-item img')].map(img=>({src:img.currentSrc||img.src,alt:img.alt}));
 if(!fotosGaleriaAtuais.length)return;
 indiceFotoGaleria=Math.max(0,Math.min(Number(indice)||0,fotosGaleriaAtuais.length-1));
 atualizarFotoGaleria();
 viewer.classList.add('is-open');
 viewer.setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
 document.addEventListener('keydown',teclasGaleria);
}
function atualizarFotoGaleria(){
 const item=fotosGaleriaAtuais[indiceFotoGaleria];
 const img=document.getElementById('gallery-viewer-image');
 const caption=document.getElementById('gallery-viewer-caption');
 const counter=document.getElementById('gallery-viewer-counter');
 if(!item||!img)return;
 img.src=item.src;img.alt=item.alt||'Foto do estabelecimento';
 if(caption)caption.textContent=item.alt||'';
 if(counter)counter.textContent=`${indiceFotoGaleria+1} / ${fotosGaleriaAtuais.length}`;
}
function moverFotoGaleria(direcao,event){
 if(event){event.preventDefault();event.stopPropagation()}
 if(!fotosGaleriaAtuais.length)return;
 indiceFotoGaleria=(indiceFotoGaleria+direcao+fotosGaleriaAtuais.length)%fotosGaleriaAtuais.length;
 atualizarFotoGaleria();
}
function fecharFotoGaleria(event){
 if(event){event.preventDefault();event.stopPropagation()}
 const viewer=document.getElementById('gallery-viewer');
 if(!viewer)return;
 viewer.classList.remove('is-open');
 viewer.setAttribute('aria-hidden','true');
 document.body.style.overflow='';
 document.removeEventListener('keydown',teclasGaleria);
}
function teclasGaleria(event){
 if(event.key==='Escape')fecharFotoGaleria();
 if(event.key==='ArrowRight')moverFotoGaleria(1);
 if(event.key==='ArrowLeft')moverFotoGaleria(-1);
}

ating-save" onclick="avaliarLoja(${l.id})">Salvar avaliação</button></div><small id="rating-status" class="rating-status">${ratingLoadError?'Não foi possível carregar as avaliações. Execute o SQL atualizado no Supabase.': 'Escolha sua nota; ela só será registrada ao clicar em Salvar avaliação.'}</small></div><div class="box"><h3>Galeria</h3><div class="gal">${l.galeria.map((u,i)=>`<button type="button" class="gal-item" onclick="abrirFotoGaleria(${i})" aria-label="Ampliar foto ${i+1}"><img src="${esc(u)}" alt="Foto ${i+1} de ${esc(l.nome)}" loading="lazy"><span class="gal-zoom" aria-hidden="true">⌕</span></button>`).join('')||'<p>Esta loja ainda não possui fotos adicionais.</p>'}</div>

async function registrar(id,tipo){let key='pvj_visitante';let v=localStorage.getItem(key);if(!v){v=crypto.randomUUID();localStorage.setItem(key,v)}let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));const {error}=await sb.rpc('registrar_evento_loja',{p_loja_id:id,p_tipo:tipo,p_visitante_hash:hash});if(error)throw error;}
function login(){if(user){go('admin');return}app.innerHTML=`<div class="ad" style="max-width:420px"><button class="btn s" onclick="go('')">← Voltar</button><h2>Entrar como administrador</h2><form class="f" id="lf"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><div class="err" id="er"></div><button class="btn">Entrar</button></form></div>`;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();let er=document.getElementById('er');let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){er.textContent='Não foi possível entrar: '+error.message;return}if(!await isAdmin()){await sb.auth.signOut();er.textContent='Este usuário não está autorizado como administrador.';return}await load();go('admin')};}
async function admin(){if(!await isAdmin()){go('login');return}await load();let stats={};const sr=await sb.rpc('estatisticas_lojas');if(!sr.error)(sr.data||[]).forEach(x=>stats[x.loja_id]={acessos:x.acessos,conversas:x.conversas});app.innerHTML=`<div class="ad"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="flex:1">Painel administrativo</h2><button class="btn s" onclick="go('')">Ver portal</button><button class="btn s" onclick="sair()">Sair da conta</button></div><button class="btn" onclick="go('novo')">+ Nova loja</button><div class="box"><h3>Categorias</h3><div style="display:flex;gap:8px"><input id="nc" placeholder="Nova categoria"><button class="btn" onclick="addCat()">Adicionar</button></div>${cats.map(c=>`<div class="lr"><div class="g">${esc(c.nome)}</div><button class="btn d" onclick="delCat(${c.id})">Excluir</button></div>`).join('')}</div>${lojas.map(l=>`<div class="lr"><img src="${esc(l.logo)}"><div class="g"><b>${esc(l.nome)}</b><small>${esc(l.cat)}</small><div class="stats"><div class="ib"><b>${stats[l.id]?.acessos||0}</b>Acessos à página</div><div class="ib"><b>${stats[l.id]?.conversas||0}</b>Conversas via WhatsApp</div></div></div><button class="btn s" onclick="go('edit-${l.id}')">Editar</button><button class="btn d" onclick="delLoja(${l.id})">Excluir</button></div>`).join('')}</div>`;}
async function sair(){const {error}=await sb.auth.signOut();if(error){alert('Não foi possível sair da conta: '+error.message);return}user=null;go('')}
async function addCat(){let n=document.getElementById('nc').value.trim();if(!n)return;let {error}=await sb.from('categorias').insert({categoria:n});if(error)alert(error.message);else admin()}
async function delCat(id){if(!confirm('Excluir categoria?'))return;let {error}=await sb.from('categorias').delete().eq('id',id);if(error)alert(error.message);else admin()}
async function delLoja(id){if(!confirm('Excluir esta loja?'))return;let {error}=await sb.from('Lojas').delete().eq('id',id);if(error)alert(error.message);else admin()}
function form(id){let l=id?lojas.find(x=>String(x.id)===String(id)):null;draft=l?{...l,galeria:[...l.galeria]}:{ativo:true,galeria:[],produtos_servicos:[],formas_pagamento:[]};app.innerHTML=`<div class="ad"><button class="btn s" onclick="go('admin')">← Voltar</button><h2>${id?'Editar':'Nova'} loja</h2><form class="f" id="sf"><label>Nome<input name="nome" required value="${esc(draft.nome)}"></label><label>Categoria<select name="categoria" required><option value="">Selecione</option>${cats.map(c=>`<option ${c.nome===draft.cat?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Descrição<textarea name="descricao">${esc(draft.desc)}</textarea></label><label>Endereço<input name="endereco" value="${esc(draft.end)}"></label><label>Telefone / WhatsApp<input name="telefone_whatsapp" value="${esc(draft.wpp)}" required></label><label>Horário<input name="horario_atendimento" value="${esc(draft.horario)}"></label><label>Produtos e serviços <textarea name="produtos_servicos_texto" rows="4" placeholder="Digite um produto ou serviço por linha">${esc(draft.produtos_servicos.join('\\n'))}</textarea><span class="file-hint">Informe somente os nomes, um por linha. Ex.: Pastéis, Tapiocas, Sucos.</span></label><fieldset class="payment-options-field"><legend>Formas de pagamento</legend><div class="payment-options">${['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência bancária','Vale-alimentação','Vale-refeição'].map((op,i)=>`<label class="payment-option"><input type="checkbox" name="formas_pagamento_opcao" value="${esc(op)}" ${draft.formas_pagamento.includes(op)?'checked':''}><span>${esc(op)}</span></label>`).join('')}</div><span class="file-hint">Selecione todas as formas de pagamento aceitas pelo estabelecimento.</span></fieldset><label>Instagram<input name="instagram" value="${esc(draft.insta)}"></label><label>Imagem do card<input type="file" id="logo" accept="image/*"><span class="file-hint">A imagem será comprimida automaticamente antes do envio (máximo final: 120 KB).</span></label><label>Banner<input type="file" id="banner" accept="image/*"><span class="file-hint">Dimensões obrigatórias: 1137 × 380 px. Compressão automática (máximo final: 120 KB).</span></label><label>Fotos da galeria<input type="file" id="galeria" accept="image/*" multiple><span class="file-hint">Todas as fotos serão comprimidas automaticamente (máximo final: 120 KB por foto).</span></label><label><input type="checkbox" name="ativo" ${draft.ativo!==false?'checked':''}> Loja ativa</label><div class="err" id="er" aria-live="polite"></div><button class="btn" id="save-store">Salvar loja</button></form></div>`;
async function validarImagem(file,rotulo,exigirBanner=false){if(!file)return;if(!file.type.startsWith('image/'))throw new Error(`${rotulo}: selecione um arquivo de imagem.`);if(exigirBanner){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Não foi possível ler as dimensões do banner.'));img.src=url});if(img.naturalWidth!==1137||img.naturalHeight!==380)throw new Error(`Banner: a imagem precisa ter exatamente 1137 × 380 px. A imagem selecionada tem ${img.naturalWidth} × ${img.naturalHeight} px.`)}finally{URL.revokeObjectURL(url)}}}
async function comprimirImagem(file,rotulo,manterDimensoes=false){if(!file)return null;let img,url=URL.createObjectURL(file);try{img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error(`${rotulo}: não foi possível abrir a imagem.`));img.src=url});const originalW=img.naturalWidth,originalH=img.naturalHeight;let w=manterDimensoes?originalW:Math.min(originalW,1600),h=manterDimensoes?originalH:Math.round(originalH*(w/originalW));const limite=120*1024;let melhor=null;for(let escala=1;escala>=.4;escala-=.1){if(!manterDimensoes&&escala<1){w=Math.max(1,Math.round(Math.min(originalW,1600)*escala));h=Math.max(1,Math.round(Math.min(originalW,1600)*escala*originalH/originalW))}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Não foi possível preparar a imagem para compressão.');ctx.drawImage(img,0,0,w,h);for(const qualidade of [.82,.72,.62,.52,.42,.32,.24]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',qualidade));if(!blob)throw new Error('O navegador não conseguiu comprimir a imagem.');if(!melhor||blob.size<melhor.size)melhor=blob;if(blob.size<=limite)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp',lastModified:Date.now()})}if(manterDimensoes)break}if(!melhor||melhor.size>limite)throw new Error(`${rotulo}: não foi possível reduzir a imagem para até 120 KB mantendo ${manterDimensoes?'as dimensões obrigatórias do banner':'uma qualidade adequada'}. Selecione uma imagem menor.`);return new File([melhor],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp',lastModified:Date.now()})}finally{URL.revokeObjectURL(url)}}
document.getElementById('sf').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,botao=document.getElementById('save-store'),erro=document.getElementById('er');botao.disabled=true;erro.textContent='Preparando e comprimindo as imagens…';try{let fd=new FormData(f),d=Object.fromEntries(fd.entries());d.ativo=f.ativo.checked;d.produtos_servicos=parseLista(fd.get('produtos_servicos_texto'));d.formas_pagamento=fd.getAll('formas_pagamento_opcao');delete d.formas_pagamento_opcao;delete d.produtos_servicos_texto;const logoOriginal=document.getElementById('logo').files[0],bannerOriginal=document.getElementById('banner').files[0],galeriaOriginal=[...document.getElementById('galeria').files];await validarImagem(logoOriginal,'Imagem do card');await validarImagem(bannerOriginal,'Banner',true);for(const file of galeriaOriginal)await validarImagem(file,'Foto da galeria');const [logoFile,bannerFile]=await Promise.all([comprimirImagem(logoOriginal,'Imagem do card'),comprimirImagem(bannerOriginal,'Banner',true)]);const galeriaFiles=[];for(let i=0;i<galeriaOriginal.length;i++){erro.textContent=`Comprimindo foto ${i+1} de ${galeriaOriginal.length}…`;galeriaFiles.push(await comprimirImagem(galeriaOriginal[i],`Foto ${i+1} da galeria`))}const folder=(draft.nome||d.nome||'loja').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');async function upload(file,sub){if(!file)return null;const path=`${folder}/${sub}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await sb.storage.from('fotos_lojas').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return fileUrl(path)}erro.textContent='Enviando imagens otimizadas…';const logo=await upload(logoFile,'imagem_card'),banner=await upload(bannerFile,'banner');let gal=[...draft.galeria];for(const file of galeriaFiles){const url=await upload(file,'galeria');if(url)gal.push(url)}d.imagem_card=logo||draft.logo||null;d.Banner=banner||draft.banner||null;d.galeria=JSON.stringify(gal);const result=id?await sb.from('Lojas').update(d).eq('id',id):await sb.from('Lojas').insert(d);if(result.error)throw result.error;await admin()}catch(err){erro.textContent='Erro ao salvar: '+err.message;botao.disabled=false}}}
init();
</script></body></html>
